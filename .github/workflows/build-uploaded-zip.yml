name: Build RashedTV APK

on:
  push:
    branches: [main]
    paths:
      - 'RashedTV.zip'
      - '.github/workflows/build-uploaded-zip.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check uploaded source archive
        run: |
          test -f RashedTV.zip || { echo "RashedTV.zip is missing. Upload the project ZIP to the repository root."; exit 1; }
          unzip -t RashedTV.zip

      - name: Extract project
        run: |
          mkdir -p source
          unzip -q RashedTV.zip -d source
          BUILD_FILE="$(find source -name settings.gradle.kts -o -name settings.gradle | head -n 1)"
          test -n "$BUILD_FILE" || { echo "Gradle settings file was not found in the ZIP."; exit 1; }
          echo "PROJECT_DIR=$(dirname "$BUILD_FILE")" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleRelease --no-daemon --stacktrace

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RashedTV-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
